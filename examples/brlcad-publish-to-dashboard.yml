# Example source-repo publishing sketch for BRL-CAD/brlcad.
# This is not intended to be dropped in as-is; fold the publishing steps into the
# existing performance workflow after perf-package/ has been generated.

name: Publish performance package to dashboard

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout BRL-CAD
        uses: actions/checkout@v6
        with:
          path: brlcad

      # Existing performance workflow should generate this directory.
      # Expected minimum file: perf-package/summary.json
      - name: Placeholder for performance package generation
        working-directory: brlcad
        run: |
          echo "Generate perf-package/summary.json in the real workflow."
          test -f perf-package/summary.json

      - name: Checkout performance dashboard
        uses: actions/checkout@v6
        with:
          repository: BRL-CAD/performance-dashboard
          path: performance-dashboard
          ssh-key: ${{ secrets.PERF_DASHBOARD_DEPLOY_KEY }}

      - name: Copy package into immutable run archive
        shell: bash
        run: |
          set -Eeuo pipefail

          summary="brlcad/perf-package/summary.json"
          run_id="$(python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('brlcad/perf-package/summary.json').read_text())
          run = data.get('run', {}) if isinstance(data, dict) else {}
          print(run.get('id') or '')
          PY
          )"

          if [[ -z "$run_id" ]]; then
            run_id="$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_SHA::7}"
          fi

          dest="performance-dashboard/data/runs/${run_id}"
          mkdir -p "$dest"
          cp -a brlcad/perf-package/. "$dest/"
          test -f "$dest/summary.json"

      - name: Commit package to dashboard repo
        working-directory: performance-dashboard
        shell: bash
        run: |
          set -Eeuo pipefail

          if git diff --quiet -- data/runs; then
            echo "No dashboard package changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/runs
          git commit -m "Add BRL-CAD performance run ${GITHUB_SHA::7}"
          git push
