name: Ingest and deploy dashboard

on:
  push:
    branches: [main]
    paths:
      - "data/uploads/**/summary.json"
      - "site/**"
      - "scripts/**"
      - ".github/workflows/ingest_and_deploy.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: brlcad-performance-dashboard
  cancel-in-progress: false

jobs:
  ingest-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout dashboard repo
        uses: actions/checkout@v4

      - name: Validate summaries and update generated dashboard data
        run: python3 scripts/ingest_summary.py

      - name: Write ingest summary
        run: |
          set -Eeuo pipefail

          echo "## Performance dashboard ingest" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          index_path = Path("data/index.json")

          if not index_path.is_file():
              print("No data/index.json was generated.")
              raise SystemExit(1)

          index = json.loads(index_path.read_text(encoding="utf-8"))
          latest = index.get("latest_upload")

          if not latest:
              print("No uploaded summaries found.")
              raise SystemExit(0)

          print(f"Acknowledged performance upload `{latest.get('id')}`")
          print("")
          print(f"- Timestamp: `{latest.get('timestamp')}`")
          print(f"- Status: `{latest.get('status')}`")
          print(f"- Summary: `{latest.get('path')}`")
          print(f"- Package: `{latest.get('package_path')}`")

          workflow_url = latest.get("workflow_url")
          if workflow_url:
              print(f"- Source workflow: {workflow_url}")

          commit = latest.get("commit")
          short_commit = latest.get("short_commit") or (commit[:12] if commit else "")
          repository = latest.get("repository")
          if repository and commit:
              print(f"- Commit: https://github.com/{repository}/commit/{commit}")
          elif short_commit:
              print(f"- Commit: `{short_commit}`")

          lanes = latest.get("lanes") or {}
          if lanes:
              print("")
              print("Lanes:")
              for name, lane_status in lanes.items():
                  print(f"- `{name}`: `{lane_status}`")
          PY

      - name: Commit generated dashboard data
        run: |
          set -Eeuo pipefail

          paths=(
            "data/index.json"
            "data/benchmark"
            "data/rtcmp_prims"
            "data/rtcmp_generic"
          )

          existing_paths=()
          for path in "${paths[@]}"; do
            if [ -e "$path" ]; then
              existing_paths+=("$path")
            fi
          done

          if [ "${#existing_paths[@]}" -eq 0 ]; then
            echo "No generated dashboard paths exist to stage."
            exit 0
          fi

          git add "${existing_paths[@]}"

          if git diff --cached --quiet; then
            echo "No generated data changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git commit -m "Update generated dashboard data"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build static site
        run: |
          set -Eeuo pipefail

          rm -rf _site
          mkdir -p _site

          cp -R site/. _site/
          cp -R data _site/data

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: ingest-build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4